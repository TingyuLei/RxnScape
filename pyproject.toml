[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rxnscape"
version = "1.0.0"
description = "Reactive MD trajectory analysis of interpretable reaction pathways and networks"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-RxnScape-Research-Source-1.0"
license-files = ["LICENSE"]
authors = [
  {name = "Dexin Sun"},
  {name = "Tingyu Lei"},
]
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "cycler", "ase", "networkx", "PyYAML", "tqdm", "plotly", "numba", "rdkit", "pyvis"]

[project.urls]
Repository = "https://github.com/TingyuLei/RxnScape"

[project.scripts]
rxnscape = "rxn:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["main", "rxn"]
